<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sign in</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F7F3EB;color:#1A1211;font:16px/1.5 Manrope,Pretendard,sans-serif}
  form{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #DED6C8;border-radius:16px;padding:28px 24px;box-shadow:0 8px 24px rgba(46,30,20,.06)}
  h1{margin:0 0 8px;font-size:22px}
  p{margin:0 0 18px;color:#5A5654;font-size:14px}

  button{margin-top:18px;width:100%;border:0;border-radius:8px;background:#7A1F2B;color:#fff;font:inherit;font-weight:700;padding:11px 14px;cursor:pointer}
  .err{color:#7F1D1D;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<form id="acd-gate">
  <h1>Sign in</h1>
  <p>Username and password are required.<br>아이디와 비밀번호를 입력하세요.</p>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" required>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Continue</button>
  <div class="err" id="err" hidden>Those details were not accepted.</div>
</form>

const KEY="acd-cred";
function bytes(s){const b=atob(s);const o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o}
async function openWith(cred){
  const sep=cred.indexOf("\n");
  if(sep<1) throw new Error("shape");
  const user=cred.slice(0,sep), pass=cred.slice(sep+1);
  const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(user+":"+pass), "PBKDF2", false, ["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2", salt:bytes(P.s), iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM", iv:bytes(P.i)}, key, bytes(P.c));
  const html=new TextDecoder().decode(plain);
  try{ sessionStorage.setItem(KEY, cred); }catch(e){}
  document.open(); document.write(html); document.close();
}
const form=document.getElementById("acd-gate");
const err=document.getElementById("err");
form.addEventListener("submit", async function(ev){
  ev.preventDefault();
  err.hidden=true;
  const cred=document.getElementById("u").value+"\n"+document.getElementById("p").value;
  try{ await openWith(cred); }catch(e){ err.hidden=false; }
});
try{
  const saved=sessionStorage.getItem(KEY);
  if(saved) openWith(saved).catch(function(){ try{sessionStorage.removeItem(KEY)}catch(e){} });
}catch(e){}
</script>
